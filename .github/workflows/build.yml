name: Build RakClient Compatible

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RakClient
        uses: actions/checkout@v4

      - name: Remove developer-local patch
        run: |
          sed -i '/^\[patch\.crates-io\]/,/^$/d' Cargo.toml
          grep -n "rerecast\|patch.crates" Cargo.toml || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build RakClient
        run: |
          cargo build --release -p app

      - name: Check binary
        run: |
          file target/release/rakclient
          strings target/release/rakclient | grep -o 'GLIBC_[0-9.]*' | sort -Vu || true

      - name: Upload RakClient
        uses: actions/upload-artifact@v4
        with:
          name: rakclient-linux-x86_64
          path: target/release/rakclient
