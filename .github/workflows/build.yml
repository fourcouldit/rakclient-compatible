name: Build RakClient Compatible

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RakClient
        uses: actions/checkout@v4
        with:
          repository: Newmcpe/RakClient
          path: rakclient-source

      - name: Remove developer-local patch
        working-directory: rakclient-source
        run: |
          sed -i '/^\[patch\.crates-io\]/,$d' Cargo.toml
          echo "Cargo.toml fixed:"
          tail -20 Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build RakClient
        working-directory: rakclient-source
        run: |
          cargo build --release -p app

      - name: Check binary
        working-directory: rakclient-source
        run: |
          file target/release/rakclient
          strings target/release/rakclient | grep -o 'GLIBC_[0-9.]*' | sort -Vu || true

      - name: Upload RakClient
        uses: actions/upload-artifact@v4
        with:
          name: rakclient-linux-x86_64
          path: rakclient-source/target/release/rakclient
