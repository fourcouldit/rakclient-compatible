name: Build RakClient Old GLIBC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Newmcpe/RakClient
          path: source

      - name: Build inside old Linux environment
        run: |
          docker run --rm \
            -v "$PWD/source:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -lc '
              set -e

              yum install -y git curl gcc gcc-c++ make perl openssl-devel

              sed -i "/^\[patch\.crates-io\]/,\$d" Cargo.toml

              curl --proto "=https" --tlsv1.2 -sSf \
                https://sh.rustup.rs | sh -s -- -y

              source "$HOME/.cargo/env"

              echo "===== BUILD ENVIRONMENT ====="
              ldd --version | head -1
              rustc --version

              echo "===== BUILD ====="
              cargo build --release -p app

              echo "===== BINARY ====="
              file target/release/rakclient

              echo "===== GLIBC SYMBOLS ====="
              strings target/release/rakclient |
                grep -o "GLIBC_[0-9.]*" |
                sort -Vu || true

              mkdir -p /work/output
              cp target/release/rakclient /work/output/rakclient
            '

      - name: Verify artifact
        run: |
          ls -lh source/output/rakclient
          file source/output/rakclient

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rakclient-linux-x86_64-old-glibc
          path: source/output/rakclient
